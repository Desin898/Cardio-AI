<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor ECG Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #2ecc71; padding-bottom: 10px; }
        .upload-area { 
            border: 2px dashed #3498db; 
            border-radius: 10px; 
            padding: 40px; 
            text-align: center; 
            margin: 30px 0;
            background: #f8f9fa;
            cursor: pointer;
        }
        .upload-area:hover { background: #e8f4fc; }
        .patient-info { margin: 20px 0; }
        input, textarea, select { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
        }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
        .upload-btn { background: #2ecc71; color: white; }
        .back-btn { background: #95a5a6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Direct ECG Upload for Analysis</h1>
        <p>Upload patient ECG reports for AI analysis and blockage detection.</p>
        
        <div class="patient-info">
            <h3>Patient Information</h3>
            <input type="text" id="patient-id" placeholder="Patient ID or Name">
            <input type="number" id="patient-age" placeholder="Age" min="1" max="120">
            <select id="patient-gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <textarea id="patient-notes" placeholder="Clinical notes (optional)" rows="3"></textarea>
        </div>

        <div class="upload-area" onclick="document.getElementById('ecg-file').click()">
            <h3>📁 Upload ECG File</h3>
            <p>Click to select or drag & drop ECG file</p>
            <p><small>Supported formats: PDF, JPG, PNG, DICOM</small></p>
            <input type="file" id="ecg-file" accept=".pdf,.jpg,.jpeg,.png,.dicom" style="display: none;">
            <p id="file-name" style="margin-top: 10px; color: #3498db;"></p>
        </div>

        <div class="button-group">
            <button class="back-btn" onclick="window.location.href='doctor-login.html'">
                Back
            </button>
            <button class="upload-btn" onclick="uploadECG()">
                Upload & Analyze with AI
            </button>
        </div>
    </div>

    <script>
        // Check if doctor is verified
        if (!localStorage.getItem('doctorVerified')) {
            window.location.href = 'doctor-login.html';
        }

        const fileInput = document.getElementById('ecg-file');
        const fileName = document.getElementById('file-name');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                fileName.textContent = `Selected: ${e.target.files[0].name}`;
            }
        });

        function uploadECG() {
            const patientId = document.getElementById('patient-id').value;
            const patientAge = document.getElementById('patient-age').value;
            const patientGender = document.getElementById('patient-gender').value;
            const file = fileInput.files[0];

            if (!patientId || !patientAge || !patientGender || !file) {
                alert('Please fill in all patient information and select an ECG file.');
                return;
            }

            // In a real system, upload to server
            alert(`ECG uploaded successfully for patient ${patientId}!\n\nAI analysis initiated. Results will be available shortly.`);
            
            // Reset form
            document.getElementById('patient-id').value = '';
            document.getElementById('patient-age').value = '';
            document.getElementById('patient-gender').value = '';
            document.getElementById('patient-notes').value = '';
            fileInput.value = '';
            fileName.textContent = '';
        }
    </script>
</body>
</html>
