<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #2ecc71; padding-bottom: 10px; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; color: #34495e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .button-group { display: flex; gap: 10px; margin-top: 30px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; flex: 1; }
        .login-btn { background: #2ecc71; color: white; }
        .back-btn { background: #95a5a6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Doctor Login & Verification</h1>
        <p>Medical professional verification required for ECG upload.</p>
        
        <div class="form-group">
            <label for="license">Medical License Number:</label>
            <input type="text" id="license" placeholder="Enter your medical license number">
        </div>

        <div class="form-group">
            <label for="specialty">Medical Specialty:</label>
            <select id="specialty">
                <option value="">Select your specialty</option>
                <option value="cardiology">Cardiology</option>
                <option value="internal">Internal Medicine</option>
                <option value="general">General Practice</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hospital">Hospital/Institution:</label>
            <input type="text" id="hospital" placeholder="Enter your hospital name">
        </div>

        <div class="form-group">
            <label for="email">Professional Email:</label>
            <input type="email" id="email" placeholder="name@hospital.org">
        </div>

        <div class="button-group">
            <button class="back-btn" onclick="window.location.href='index.html'">
                Back
            </button>
            <button class="login-btn" onclick="verifyDoctor()">
                Verify & Proceed to Upload
            </button>
        </div>
    </div>

    <script>
        function verifyDoctor() {
            const license = document.getElementById('license').value;
            const specialty = document.getElementById('specialty').value;
            const hospital = document.getElementById('hospital').value;
            const email = document.getElementById('email').value;

            if (!license || !specialty || !hospital || !email) {
                alert('Please fill in all verification fields.');
                return;
            }

            // In a real system, this would verify against a database
            // For demo, we'll accept any properly filled form
            localStorage.setItem('doctorVerified', 'true');
            localStorage.setItem('doctorInfo', JSON.stringify({
                license: license,
                specialty: specialty,
                hospital: hospital,
                email: email
            }));

            // Redirect to ECG upload page
            window.location.href = 'doctor-upload.html';
        }
    </script>
</body>
</html>
