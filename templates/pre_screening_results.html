<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioAI · Screening Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(145deg, #e9eff9 0%, #d8e3f0 100%); font-family: 'Inter', sans-serif; padding:1.5rem; }
        .main-container { max-width:800px; margin:0 auto; }
        .card { border-radius:32px; background:rgba(255,255,255,0.75); backdrop-filter:blur(12px); border: none; padding: 2rem; }
        .risk-badge { font-size: 1.2rem; padding: 0.5rem 1.5rem; border-radius: 40px; }
        .factor-item { background: rgba(255,255,255,0.5); border-radius: 20px; padding: 1rem; margin-bottom: 0.75rem; }
        .btn-secondary { border-radius: 40px; background: #e0e7f0; color: #1f3a6b; border: none; }
        .btn-secondary:hover { background: #d0d9e5; }
        .section-title { font-weight:600; color:#13293e; border-left:4px solid #2a5298; padding-left:15px; margin: 1.5rem 0 1.2rem; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card">
            <div class="d-flex align-items-center mb-4">
                <i class="fas fa-heartbeat fs-1 me-3" style="color:#2a5298;"></i>
                <h2 class="mb-0">Screening Result</h2>
            </div>

            <div id="resultContent">
                <!-- dynamic content inserted by JS -->
            </div>

            <div class="mt-4 text-center">
                <a href="/" class="btn btn-secondary px-4 py-2 me-2">New Screening</a>
                <a href="#" id="uploadLink" class="btn btn-primary px-4 py-2">Proceed to ECG Upload</a>
            </div>
        </div>
    </div>

    <script>
        function displayResult() {
            const resultStr = localStorage.getItem('screeningResult');
            if (!resultStr) {
                window.location.href = '/';  // no result, go back to form
                return;
            }

            const result = JSON.parse(resultStr);
            const container = document.getElementById('resultContent');
            const uploadLink = document.getElementById('uploadLink');

            // Set link based on whether ECG is required (adjust URLs to your actual pages)
            if (result.requires_ecg) {
                uploadLink.href = '/upload_ecg.html';   // mandatory upload page
                uploadLink.textContent = 'Upload ECG (Mandatory)';
            } else {
                uploadLink.href = '/upload_ecg_optional.html'; // optional upload page
                uploadLink.textContent = 'Upload ECG (Optional)';
            }

            const badgeClass = result.color === 'red' ? 'bg-danger' : 'bg-success';

            let html = `
                <div class="text-center mb-4">
                    <span class="risk-badge ${badgeClass} text-white">${result.risk_status}</span>
                </div>
                <div class="mb-4">
                    <h4>Risk Probability: ${(result.risk_probability * 100).toFixed(1)}%</h4>
                    <p class="lead">${result.message}</p>
                </div>
                <hr>
                <h5 class="section-title">Key Contributing Factors</h5>
            `;

            if (result.explanation && result.explanation.length > 0) {
                result.explanation.forEach((factor, idx) => {
                    const emoji = factor.effect === 'higher risk' ? '🔴' : '🟢';
                    html += `
                        <div class="factor-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <span><strong>${idx+1}. ${emoji} ${factor.factor}</strong> (value: ${factor.value})</span>
                                <span class="badge bg-light text-dark">impact: ${factor.impact > 0 ? '+' : ''}${factor.impact}</span>
                            </div>
                            <small class="text-muted">${factor.effect}</small>
                        </div>
                    `;
                });
            } else {
                html += '<p>No explanation factors available.</p>';
            }

            html += `
                <hr>
                <p><strong>Next step:</strong> ${result.next_step.replace('_', ' ')}</p>
            `;

            container.innerHTML = html;
        }

        displayResult();
    </script>
</body>
</html>
